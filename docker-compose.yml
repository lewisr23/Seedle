# Shared by the two containers that boot the Laravel app. Keeping it in one
# place stops the web tier and the worker drifting onto different databases.
x-backend-env: &backend-env
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: seedle
  DB_USERNAME: seedle
  DB_PASSWORD: seedle
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  ELASTICSEARCH_HOST: http://elasticsearch:9200

# The bind mount gives live code reload, but it also hides everything the image
# built into those two directories. Anonymous volumes keep the image's copies
# visible, and keep the container's --no-dev vendor from overwriting the host's
# dev install (which `php artisan test` on the host still needs).
x-backend-volumes: &backend-volumes
  - ./backend:/var/www/html
  - /var/www/html/vendor
  - /var/www/html/bootstrap/cache

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seedle
      MYSQL_USER: seedle
      MYSQL_PASSWORD: seedle
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 on the host: a native Windows mysqld already owns 3306. Nothing
      # inside the network cares. The app reaches this on mysql:3306 either
      # way, so this port only matters for connecting a GUI client.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: &backend-build
      context: ./backend
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    volumes: *backend-volumes
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # A dedicated worker container is what makes fulfilment async in practice: # scale this independently of the web tier with `docker compose up -d --scale queue-worker=3`.
  queue-worker:
    build: *backend-build
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3
    volumes: *backend-volumes
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ReindexOrderedProducts runs on this container, so it needs the cluster too.
      elasticsearch:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api
      # Switches Vite's watcher to polling. See vite.config.js.
      DOCKER: "true"

volumes:
  mysql-data:
  es-data:
