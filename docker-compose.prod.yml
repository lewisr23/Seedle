# Production stack for a single VPS. Differs from the dev compose in three
# ways that matter: no bind mounts (code is baked into the images), no ports
# published except 80 and 443, and secrets come from a .env file on the server
# rather than being written here.
#
#   docker compose -f docker-compose.prod.yml up -d --build

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set APP_KEY in .env}
  APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
  FRONTEND_URL: https://${APP_DOMAIN}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-seedle}
  DB_USERNAME: ${DB_USERNAME:-seedle}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  # Unset by default. The search service falls back to MySQL on its own, so
  # the stack runs fine without an Elasticsearch node to pay for.
  ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-seedle}
      MYSQL_USER: ${DB_USERNAME:-seedle}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # Uploaded images and logs are the only state the app writes.
      - app-storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue-worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3 --max-time=3600
    environment: *backend-env
    volumes:
      - app-storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel's scheduler needs a process of its own. Without this the daily
  # garden:reminders command is defined but never runs.
  scheduler:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *backend-env
    volumes:
      - app-storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: https://${APP_DOMAIN}/api
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates must outlive the container or Let's Encrypt rate limits
      # bite on every redeploy.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
  app-storage:
  caddy-data:
  caddy-config:
