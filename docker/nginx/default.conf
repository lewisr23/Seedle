server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolve the upstream per-request through Docker's embedded DNS rather
        # than once at startup: the app container gets a new IP every time it's
        # recreated, and a cached address turns into a 502 that looks like PHP
        # is down when it isn't.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
